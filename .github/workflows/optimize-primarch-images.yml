name: Optimize Primarch Images

on:
  push:
    paths:
      - 'tools/optimize-primarch-images.trigger'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image optimizer
        run: python -m pip install --upgrade Pillow

      - name: Resize and recompress Primarch portraits
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import os

          root = Path("images/primarchs")
          total_before = 0
          total_after = 0

          for path in sorted(root.glob("*.webp")):
              before = path.stat().st_size
              with Image.open(path) as source:
                  source.load()
                  original_size = source.size
                  icc_profile = source.info.get("icc_profile")
                  has_alpha = "A" in source.getbands() or "transparency" in source.info
                  image = source.copy()
                  image.thumbnail((1200, 1200), Image.Resampling.LANCZOS)
                  if image.mode not in ("RGB", "RGBA"):
                      image = image.convert("RGBA" if has_alpha else "RGB")

                  temp_path = path.with_name(path.stem + ".optimized.webp")
                  save_options = {
                      "format": "WEBP",
                      "quality": 82,
                      "method": 6,
                      "optimize": True,
                  }
                  if icc_profile:
                      save_options["icc_profile"] = icc_profile
                  image.save(temp_path, **save_options)

              os.replace(temp_path, path)
              after = path.stat().st_size
              total_before += before
              total_after += after
              print(
                  f"{path.name}: {original_size[0]}x{original_size[1]} -> "
                  f"{image.width}x{image.height}; "
                  f"{before / 1024:.1f} KB -> {after / 1024:.1f} KB"
              )

          if total_before:
              reduction = (1 - total_after / total_before) * 100
              print(
                  f"TOTAL: {total_before / 1024:.1f} KB -> "
                  f"{total_after / 1024:.1f} KB ({reduction:.1f}% smaller)"
              )
          PY

      - name: Commit optimized portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/primarchs/*.webp
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Optimize Primarch portraits for faster loading [skip ci]"
          git push origin HEAD:main
